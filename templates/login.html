{% extends "base.html" %}
{% block title %}Iniciar Sesión - Veterinaria App{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-5 col-lg-4">
    <div class="card shadow border-0">
      <div class="card-header card-header-vet text-center py-3">
        <h5 class="mb-0">Acceso al Sistema</h5>
      </div>
      <div class="card-body p-4">
        <form method="POST" action="{{ url_for('login') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label class="form-label">Usuario</label>
            <input type="text" name="nombre_usuario" class="form-control" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label">Contraseña</label>
            <input type="password" name="contraseña" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-vet w-100">Ingresar</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
